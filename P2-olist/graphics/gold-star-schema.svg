hor="start">3,096 · Type 1</text><text x="840.0" y="414.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" class="t2 halo" text-anchor="start">geo copied in</text><rect x="360.0" y="380.0" width="230.0" height="92.0" rx="8" class="boxd"/><text x="370.0" y="400.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" class="t1 halo" text-anchor="start">bridge_order_payment</text><text x="370.0" y="418.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" class="t2 halo" text-anchor="start">103,886 payments</text><text x="370.0" y="434.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" class="t2 halo" text-anchor="start">2,246 orders, 2 types</text><rect x="40.0" y="400.0" width="200.0" height="72.0" rx="8" class="boxa"/><text x="50.0" y="420.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" class="t1 halo" text-anchor="start">dim_payment_type</text><text x="50.0" y="438.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" class="t2 halo" text-anchor="start">5 types + Unknown</text><line x1="240" y1="150" x2="353.1" y2="216.0" class="edge" stroke-width="1.5"/><polygon points="360,220 351.1,219.4 355.1,212.5" class="t3"/><text x="250.0" y="150.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" class="t2 halo" text-anchor="start">purchase_date · active</text><line x1="240" y1="170" x2="353.3" y2="245.6" class="edgeb" stroke-width="1.5"/><polygon points="360,250 351.1,248.9 355.6,242.2" class="t3"/><text x="246.0" y="222.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" class="t2 halo" text-anchor="start">delivered, estimated</text><text x="246.0" y="236.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" class="t2 halo" text-anchor="start">(inactive)</text><line x1="240" y1="296" x2="352.2" y2="271.7" class="edge" stroke-width="1.5"/><polygon points="360,270 353.0,275.6 351.3,267.8" class="t3"/><text x="256.0" y="300.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" class="t2 halo" text-anchor="start">customer_sk</text><line x1="590" y1="245" x2="692.0" y2="245.0" class="edge" stroke-width="1.5"/><polygon points="700,245 692.0,249.0 692.0,241.0" class="t3"/><text x="612.0" y="238.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" class="t2 halo" text-anchor="start">order_key</text><line x1="760" y1="360" x2="777.5" y2="307.6" class="edge" stroke-width="1.5"/><polygon points="780,300 781.3,308.9 773.7,306.3" class="t3"/><line x1="890" y1="360" x2="872.5" y2="307.6" class="edge" stroke-width="1.5"/><polygon points="870,300 876.3,306.3 868.7,308.9" class="t3"/><line x1="475" y1="300" x2="475.0" y2="372.0" class="edge" stroke-width="1.5"/><polygon points="475,380 471.0,372.0 479.0,372.0" class="t3"/><text x="482.0" y="344.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" class="t2 halo" text-anchor="start">order_key</text><line x1="240" y1="436" x2="352.0" y2="426.7" class="edge" stroke-width="1.5"/><polygon points="360,426 352.4,430.7 351.7,422.7" class="t3"/><text x="250.0" y="452.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" class="t2 halo" text-anchor="start">payment_type_sk</text><text x="40.0" y="494.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" class="t2 halo" text-anchor="start">All one-to-many, single direction: filters flow downhill. “Orders containing a category” and “orders by payment type” go two-way inside the</text><text x="40.0" y="510.2" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" class="t2 halo" text-anchor="start">measure only (CROSSFILTER).</text><text x="24.0" y="546.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" class="t3 halo" text-anchor="start">Source: DP600_BUILD_GUIDE.md “Before Day 10” and Days 13–15; row counts from OneLake, 2026-09-24</text></svg>