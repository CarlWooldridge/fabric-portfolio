<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img"><title>The gold model: header → lines, a payments bridge, SCD2 customers</title><desc>No dim_order: fact_orders is both the order-level fact and the “one” side for the lines. No geo dimension: city, state and lat/lng are copied onto each dimension, so “state” can&#x27;t silently mean the wrong one. Every -1 Unknown count is 0.</desc><style>
.bg{fill:#fcfcfb}.card{fill:#fcfcfb;stroke:rgba(11,11,11,.12)}.panel{fill:#f4f3f0;stroke:rgba(11,11,11,.08)}
