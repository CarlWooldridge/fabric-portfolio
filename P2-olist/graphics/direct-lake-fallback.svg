</style><rect x="0.5" y="0.5" width="899.0" height="309.0" rx="12" class="card"/><text x="24.0" y="38.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="600" class="t1 halo" text-anchor="start">A SQL view silently cost ~600× a Direct Lake query</text><text x="24.0" y="62.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" class="t2 halo" text-anchor="start">Direct Lake on SQL falls back to DirectQuery for views, SQL-endpoint RLS/CLS and over-guardrail tables. Direct Lake on</text><text x="24.0" y="79.5" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" class="t2 halo" text-anchor="start">OneLake never falls back. It errors instead.</text><text x="24.0" y="128.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" class="t1 halo" text-anchor="start">fact_orders (Delta table)</text><rect x="250.0" y="114.0" width="3.0" height="22.0" rx="3" class="s1"/><text x="258.0" y="130.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" class="t1 halo" text-anchor="start">17 ms · Scan (Direct Lake)</text><text x="24.0" y="188.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" class="t1 halo" text-anchor="start">v_delivered_orders (SQL view)</text><rect x="250.0" y="174.0" width="565.8" height="22.0" rx="3" class="s2"/><rect x="817.8" y="174.0" width="42.7" height="22.0" rx="3" class="s4"/><text x="250.0" y="214.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" class="t1 halo" text-anchor="start">9,329 ms opening the DirectQuery connection  +  704 ms running the SQL  =  10,057 ms</text><text x="24.0" y="250.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" class="t2 halo" text-anchor="start">Same model (Direct Lake on SQL), same count, cold. DirectLakeBehavior = Automatic hides this;</text><text x="24.0" y="268.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" class="t2 halo" text-anchor="start">DirectLakeOnly turns it into an error: “would require a fallback to DirectQuery … fallback is disabled.”</text><text x="24.0" y="296.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" class="t3 halo" text-anchor="start">Source: DP600_BUILD_GUIDE.md Day 25, DAX Studio Server Timings, 2026-09-24</text></svg>