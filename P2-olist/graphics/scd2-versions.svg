</style><rect x="0.5" y="0.5" width="899.0" height="405.0" rx="12" class="card"/><text x="24.0" y="38.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="600" class="t1 halo" text-anchor="start">SCD2 on real address changes: where 96,263 versions come from</text><text x="24.0" y="62.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" class="t2 halo" text-anchor="start">Olist has no change log, but 252 people ordered from a new address. That&#x27;s real change, inferred between orders. Tracked:</text><text x="24.0" y="79.5" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" class="t2 halo" text-anchor="start">zip prefix, city, state. Event time, not load time, sets valid_from.</text><text x="24.0" y="127.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" class="t1 halo" text-anchor="start">Snapshot at the watermark (2017-12-31)</text><rect x="330.0" y="112.0" width="210.4" height="20.0" rx="3" class="s1"/><text x="546.4" y="127.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" class="t1 halo" text-anchor="start">+44,034</text><text x="24.0" y="167.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" class="t1 halo" text-anchor="start">Brand-new customers in the 2018 batch</text><rect x="540.4" y="152.0" width="248.8" height="20.0" rx="3" class="s3"/><text x="795.2" y="167.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" class="t1 halo" text-anchor="start">+52,062</text><text x="24.0" y="207.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" class="t1 halo" text-anchor="start">Existing customers who moved</text><rect x="789.2" y="192.0" width="3.0" height="20.0" rx="3" class="s3"/><text x="795.7" y="207.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" class="t1 halo" text-anchor="start">+99</text><text x="24.0" y="247.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" class="t1 halo" text-anchor="start">Moves inside the batch (islands)</text><rect x="789.7" y="232.0" width="3.0" height="20.0" rx="3" class="s3"/><text x="796.0" y="247.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" class="t1 halo" text-anchor="start">+68</text><line x1="24.0" y1="276.0" x2="860.0" y2="276.0" class="axis" stroke-width="1"/><text x="24.0" y="297.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" class="t1 halo" text-anchor="start">Versions in gold.dim_customer</text><rect x="330.0" y="282.0" width="460.0" height="20.0" rx="3" class="s1"/><text x="796.0" y="297.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" class="t1 halo" text-anchor="start">96,263</text><text x="24.0" y="332.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" class="t2 halo" text-anchor="start">96,263 − 96,096 people = 167 closed versions (99 expired + 68 in-batch first addresses).</text><text x="24.0" y="350.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" class="t2 halo" text-anchor="start">The real check is current_rows = people. The first run had people = 96,195: lazy evaluation re-read</text><text x="24.0" y="368.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" class="t2 halo" text-anchor="start">“current” after the expire merge and gave 99 movers a second durable key. Fix: .localCheckpoint().</text><text x="24.0" y="392.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" class="t3 halo" text-anchor="start">Source: DP600_BUILD_GUIDE.md Day 12, verified in OneLake 2026-09-21</text></svg>