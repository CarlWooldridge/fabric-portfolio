<svg xmlns="http://www.w3.org/2000/svg" width="900" height="406" viewBox="0 0 900 406" role="img"><title>SCD2 on real address changes: where 96,263 versions come from</title><desc>Olist has no change log, but 252 people ordered from a new address. That&#x27;s real change, inferred between orders. Tracked: zip prefix, city, state. Event time, not load time, sets valid_from.</desc><style>
