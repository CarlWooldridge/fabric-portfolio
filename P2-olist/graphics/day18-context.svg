<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="690" viewBox="0 0 1040 690"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f2328"/></marker></defs><rect x="1" y="1" width="1038" height="688" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="24" y="40" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#1f2328" text-anchor="start">Filter context — what a measure can see when it runs</text><text x="24" y="64" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#57606a" text-anchor="start">A measure is evaluated once per cell. Each cell gets its own set of filters; the measure only counts rows that survive all of them.</text><rect x="24" y="90" width="300" height="58" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="38" y="114" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1f2328" text-anchor="start">1  Visual rows &amp; columns</text><text x="38" y="135" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0b3d91" text-anchor="start">matrix row SP  →  seller_state = SP</text><line x1="324" y1="119" x2="408" y2="166" stroke="#1f2328" stroke-width="2" marker-end="url(#ah)"/><rect x="24" y="160" width="300" height="58" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="38" y="184" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1f2328" text-anchor="start">2  Slicers</text><text x="38" y="205" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0b3d91" text-anchor="start">city slicer  →  seller_city = Campinas</text><line x1="324" y1="189" x2="408" y2="190" stroke="#1f2328" stroke-width="2" marker-end="url(#ah)"/><rect x="24" y="230" width="300" height="58" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="38" y="254" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1f2328" text-anchor="start">3  Filter pane</text><text x="38" y="275" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0b3d91" text-anchor="start">visual / page / report filters</text><line x1="324" y1="259" x2="408" y2="214" stroke="#1f2328" stroke-width="2" marker-end="url(#ah)"/><rect x="24" y="300" width="300" height="58" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/><text x="38" y="324" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1f2328" text-anchor="start">4  CALCULATE</text><text x="38" y="345" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#0b3d91" text-anchor="start">filters written in the measure itself</text><line x1="324" y1="329" x2="408" y2="238" stroke="#1f2328" stroke-width="2" marker-end="url(#ah)"/><rect x="412" y="150" width="280" height="104" rx="8" fill="#dbe9ff" stroke="#1f2328" stroke-width="2.5"/><text x="552" y="182" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#1f2328" text-anchor="middle">Filter context</text><text x="552" y="206" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="middle">every filter in force</text><text x="552" y="224" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="middle">for this one cell</text><text x="552" y="242" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="middle">(the Total cell has the fewest)</text><line x1="692" y1="202" x2="760" y2="202" stroke="#1f2328" stroke-width="2" marker-end="url(#ah)"/><rect x="764" y="150" width="252" height="104" rx="8" fill="#f6f8fa" stroke="#1f2328" stroke-width="2.5"/><text x="890" y="182" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2328" text-anchor="middle">The measure runs</text><text x="890" y="206" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="middle">[Revenue] sums only the</text><text x="890" y="224" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="middle">lines that pass every filter</text><line x1="24" y1="370" x2="1016" y2="370" stroke="#8c959f"/><text x="24" y="398" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1f2328" text-anchor="start">Filters flow downhill along relationships — one side → many side — and never climb back up</text><text x="24" y="420" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#57606a" text-anchor="start">Example: Setup 3, slicer customer_state = RJ.  Shaded ■ = the filter reaches it.  Dashed ✗ = it doesn't.</text><rect x="24" y="446" width="194" height="78" rx="8" fill="#dbe9ff" stroke="#1f2328" stroke-width="2.5"/><text x="121.0" y="478" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="bold" fill="#1f2328" text-anchor="middle">dim_customer</text><text x="121.0" y="502" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f2328" text-anchor="middle">■ slicer: RJ</text><rect x="290" y="446" width="194" height="78" rx="8" fill="#dbe9ff" stroke="#1f2328" stroke-width="2.5"/><text x="387.0" y="478" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="bold" fill="#1f2328" text-anchor="middle">fact_orders</text><text x="387.0" y="502" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f2328" text-anchor="middle">■ reached</text><rect x="556" y="446" width="194" height="78" rx="8" fill="#dbe9ff" stroke="#1f2328" stroke-width="2.5"/><text x="653.0" y="478" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="bold" fill="#1f2328" text-anchor="middle">fact_order_items</text><text x="653.0" y="502" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f2328" text-anchor="middle">■ reached</text><rect x="822" y="446" width="194" height="78" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="6 4"/><text x="919.0" y="478" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="bold" fill="#1f2328" text-anchor="middle">dim_seller</text><text x="919.0" y="502" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#57606a" text-anchor="middle">✗ not reached</text><line x1="218" y1="485.0" x2="286" y2="485.0" stroke="#1f2328" stroke-width="2" marker-end="url(#ah)"/><text x="252" y="477.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#57606a" text-anchor="middle">1 → *</text><line x1="484" y1="485.0" x2="552" y2="485.0" stroke="#1f2328" stroke-width="2" marker-end="url(#ah)"/><text x="518" y="477.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#57606a" text-anchor="middle">1 → *</text><line x1="818" y1="485.0" x2="754" y2="485.0" stroke="#1f2328" stroke-width="2" marker-end="url(#ah)"/><text x="786" y="477.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#57606a" text-anchor="middle">* ← 1</text><text x="786" y="546" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="middle">filters only travel with the arrow —</text><text x="786" y="562" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="middle">RJ would have to go against it</text><line x1="24" y1="576" x2="1016" y2="576" stroke="#8c959f"/><text x="24" y="602" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1f2328" text-anchor="start">The other kind: row context</text><text x="24" y="626" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="start">Inside an iterator (SUMX, FILTER, AVERAGEX) or a calculated column, DAX walks the table one row at a time — "the current row".</text><text x="24" y="646" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="start">Row context filters nothing on its own. CALCULATE — or calling a measure — turns the current row into filter context:</text><text x="24" y="666" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f2328" text-anchor="start">that's context transition. Step 4 times what it costs.</text></svg>