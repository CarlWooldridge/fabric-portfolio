pple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" class="t2 halo" text-anchor="start">Entra ID, not Fabric</text><text x="732.0" y="142.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" class="t2 halo" text-anchor="start">tenant admin, not data</text><line x1="24.0" y1="164.0" x2="1004.0" y2="164.0" class="grid" stroke-width="1"/><text x="32.0" y="182.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" class="t1 halo" text-anchor="start">2 · Workspace roles</text><text x="262.0" y="182.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" class="t2 halo" text-anchor="start">Who gets into the workspace</text><text x="532.0" y="182.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" class="t2 halo" text-anchor="start">The workspace</text><text x="732.0" y="182.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" class="t2 halo" text-anchor="start">too coarse for “protect data”</text><line x1="24.0" y1="204.0" x2="1004.0" y2="204.0" class="grid" stroke-width="1"/><text x="32.0" y="222.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" class="t1 halo" text-anchor="start">3 · Item permissions</text><text x="262.0" y="222.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" class="t2 halo" text-anchor="start">Who opens one item (Read, Build, ReadData,</text><text x="262.0" y="236.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" class="t2 halo" text-anchor="start">ReadAll)</text><text x="532.0" y="222.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" class="t2 halo" text-anchor="start">The item</text><text x="732.0" y="222.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" class="t2 halo" text-anchor="start">“build a report, don&#x27;t touch the model” →</text><text x="732.0" y="236.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" class="t2 halo" text-anchor="start">Build</text><line x1="24.0" y1="244.0" x2="1004.0" y2="244.0" class="grid" stroke-width="1"/><text x="32.0" y="262.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" class="t1 halo" text-anchor="start">4 · T-SQL GRANT / DENY</text><text x="262.0" y="262.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" class="t2 halo" text-anchor="start">Which objects</text><text x="532.0" y="262.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" class="t2 halo" text-anchor="start">Warehouse / SQL endpoint</text><text x="732.0" y="262.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" class="t2 halo" text-anchor="start">“specific objects in the warehouse”</text><line x1="24.0" y1="284.0" x2="1004.0" y2="284.0" class="grid" stroke-width="1"/><text x="32.0" y="302.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" class="t1 halo" text-anchor="start">5 · T-SQL RLS</text><text x="262.0" y="302.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" class="t2 halo" text-anchor="start">Which rows, via SQL</text><text x="532.0" y="302.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" class="t2 halo" text-anchor="start">Warehouse / SQL endpoint</text><text x="732.0" y="302.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" class="t2 halo" text-anchor="start">“users see only their region” in T-SQL</text><line x1="24.0" y1="324.0" x2="1004.0" y2="324.0" class="grid" stroke-width="1"/><text x="32.0" y="342.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" class="t1 halo" text-anchor="start">6 · T-SQL CLS</text><text x="262.0" y="342.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" class="t2 halo" text-anchor="start">Which columns, via SQL</text><text x="532.0" y="342.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" class="t2 halo" text-anchor="start">Warehouse / SQL endpoint</text><text x="732.0" y="342.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" class="t2 halo" text-anchor="start">SELECT * errors, column list works</text><line x1="24.0" y1="364.0" x2="1004.0" y2="364.0" class="grid" stroke-width="1"/><text x="32.0" y="382.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" class="t1 halo" text-anchor="start">7 · Dynamic data masking</text><text x="262.0" y="382.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" class="t2 halo" text-anchor="start">What values look like. Not access control</text><text x="532.0" y="382.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" class="t2 halo" text-anchor="start">Warehouse / SQL endpoint</text><text x="732.0" y="382.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" class="t2 halo" text-anchor="start">“without changing the application layer”</text><line x1="24.0" y1="404.0" x2="1004.0" y2="404.0" class="grid" stroke-width="1"/><text x="32.0" y="422.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" class="t1 halo" text-anchor="start">8 · OneLake security roles</text><text x="262.0" y="422.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" class="t2 halo" text-anchor="start">Tables, rows, columns in every engine</text><text x="532.0" y="422.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" class="t2 halo" text-anchor="start">Lakehouse</text><text x="732.0" y="422.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" class="t2 halo" text-anchor="start">“consistently across engines”</text><line x1="24.0" y1="444.0" x2="1004.0" y2="444.0" class="grid" stroke-width="1"/><text x="32.0" y="462.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" class="t1 halo" text-anchor="start">9 · Model RLS / OLS</text><text x="262.0" y="462.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" class="t2 halo" text-anchor="start">Rows, tables, columns in reports</text><text x="532.0" y="462.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" class="t2 halo" text-anchor="start">Semantic model</text><text x="732.0" y="462.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" class="t2 halo" text-anchor="start">“only User1 sees this measure” → OLS</text><line x1="24.0" y1="484.0" x2="1004.0" y2="484.0" class="grid" stroke-width="1"/><text x="32.0" y="502.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" class="t1 halo" text-anchor="start">10 · Sensitivity labels</text><text x="262.0" y="502.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" class="t2 halo" text-anchor="start">Classification that travels. Not access</text><text x="262.0" y="516.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" class="t2 halo" text-anchor="start">control</text><text x="532.0" y="502.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" class="t2 halo" text-anchor="start">Every item, inherited</text><text x="532.0" y="516.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" class="t2 halo" text-anchor="start">downstream</text><text x="732.0" y="502.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" class="t2 halo" text-anchor="start">“classify for compliance”</text><text x="24.0" y="548.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" class="t2 halo" text-anchor="start">Model RLS is default-deny: once a model has any role, a Viewer in none is refused. Roles add up (OR). Hidden ≠ secured: a hidden table is still queryable;</text><text x="24.0" y="564.2" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" class="t2 halo" text-anchor="start">OLS makes it not exist.</text><text x="24.0" y="600.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" class="t3 halo" text-anchor="start">Source: DP600_BUILD_GUIDE.md Week 1 close; practice assessments 2026-09-03 and 2026-09-24</text></svg>