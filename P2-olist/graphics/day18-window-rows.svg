egoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">RANK's six numbers are revenue order (Apr 2018 highest = 1). The other four don't compute anything — they hand CALCULATE or AVERAGEX a set of rows.</text></svg>