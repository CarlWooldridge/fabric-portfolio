 y="164.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" class="t2 halo" text-anchor="start">F2: 4 vCores</text><line x1="224" y1="152" x2="256.0" y2="152.0" class="edge" stroke-width="1.5"/><polygon points="264,152 256.0,156.0 256.0,148.0" class="t3"/><line x1="464" y1="152" x2="497.0" y2="133.9" class="edge" stroke-width="1.5"/><polygon points="504,130 498.9,137.4 495.1,130.4" class="t3"/><line x1="464" y1="152" x2="499.7" y2="207.3" class="edge" stroke-width="1.5"/><polygon points="504,214 496.3,209.4 503.0,205.1" class="t3"/><rect x="504.0" y="96.0" width="430.0" height="70.0" rx="8" class="boxb"/><text x="514.0" y="116.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" class="t1 halo" text-anchor="start">Starter pool, Medium node = 8 vCores</text><text x="514.0" y="134.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" class="t2 halo" text-anchor="start">One session fills all 8. The next notebook gets HTTP 430.</text><text x="514.0" y="150.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" class="t2 halo" text-anchor="start">Jobs tab: 8/8 used by one session</text><rect x="504.0" y="180.0" width="430.0" height="70.0" rx="8" class="boxc"/><text x="514.0" y="200.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" class="t1 halo" text-anchor="start">Custom pool, Small node = 4 vCores</text><text x="514.0" y="218.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" class="t2 halo" text-anchor="start">Two sessions fit (Monitor: two In progress).</text><text x="514.0" y="234.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" class="t2 halo" text-anchor="start">Price: not pre-warmed, 30 s – 5 min to start</text><text x="24.0" y="290.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" class="t2 halo" text-anchor="start">The hidden holders: a closed lakehouse “New Spark SQL query” tab keeps a LivySession for its 20-minute idle timeout.</text><text x="24.0" y="308.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" class="t2 halo" text-anchor="start">The pipeline fix: high concurrency + one session tag, so notebook activities share a session (their Monitor names carry HC_).</text><text x="24.0" y="326.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" class="t2 halo" text-anchor="start">Not Spark (own engines, still CU): Copy activity, Dataflow Gen2, SQL endpoint/Warehouse, semantic models, KQL, Python/T-SQL notebooks.</text><text x="24.0" y="346.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" class="t3 halo" text-anchor="start">Source: DP600_BUILD_GUIDE.md exam-4, 2026-09-24</text></svg>