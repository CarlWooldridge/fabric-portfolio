l, sans-serif" font-size="13" font-weight="600" class="t1 halo" text-anchor="start">If new &gt; 0</text><text x="396.0" y="150.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" class="t2 halo" text-anchor="start">int(exitValue) &gt; 0</text><rect x="560.0" y="104.0" width="190.0" height="56.0" rx="8" class="boxc"/><text x="570.0" y="124.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" class="t1 halo" text-anchor="start">Load Orders Increment</text><text x="570.0" y="142.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" class="t2 halo" text-anchor="start">MERGE orders + lines</text><rect x="560.0" y="168.0" width="190.0" height="40.0" rx="8" class="box"/><text x="570.0" y="188.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" class="t1 halo" text-anchor="start">False: nothing</text><rect x="790.0" y="104.0" width="180.0" height="56.0" rx="8" class="boxb"/><text x="800.0" y="124.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" class="t1 halo" text-anchor="start">Log Error</text><text x="800.0" y="142.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" class="t2 halo" text-anchor="start">On fail → meta.load_errors</text><rect x="24.0" y="196.0" width="500.0" height="44.0" rx="8" class="box"/><text x="34.0" y="216.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" class="t1 halo" text-anchor="start">Land raw CSVs — ForEach × 9 → Copy data → staging (runs alongside)</text><line x1="174" y1="144" x2="192.0" y2="144.0" class="edge" stroke-width="1.5"/><polygon points="200,144 192.0,148.0 192.0,140.0" clas