 font-weight="normal" class="t2 halo" text-anchor="start">2m 10s</text><rect x="444.0" y="312.0" width="190.0" height="56.0" rx="8" class="boxc"/><text x="454.0" y="332.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" class="t1 halo" text-anchor="start">Dim Customer SCD2</text><text x="454.0" y="350.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" class="t2 halo" text-anchor="start">1m 12s</text><rect x="654.0" y="312.0" width="190.0" height="56.0" rx="8" class="boxc"/><text x="664.0" y="332.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" class="t1 halo" text-anchor="start">Gold Build</text><text x="664.0" y="350.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" class="t2 halo" text-anchor="start">1m 41s</text><line x1="214" y1="340" x2="226.0" y2="340.0" class="edge" stroke-width="1.5"/><polygon points="234,340 226.0,344.0 226.0,336.0" class="t3"/><line x1="424" y1="340" x2="436.0" y2="340.0" class="edge" stroke-width="1.5"/><polygon points="444,340 436.0,344.0 436.0,336.0" class="t3"/><line x1="634" y1="340" x2="646.0" y2="340.0" class="edge" stroke-width="1.5"/><polygon points="654,340 646.0,344.0 646.0,336.0" class="t3"/><text x="24.0" y="390.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" class="t2 halo" text-anchor="start">One shared Spark session (high concurrency + session tag), or the 8-core trial refuses the second notebook with HTTP 430. Key sums identical before and after: nothing re-keyed.</text><text x="24.0" y="428.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" class="t1 halo" text-anchor="start">P2 Maintenance — OPTIMIZE only when it&#x27;s needed</text><rect x="24.0" y="440.0" width="170.0" height="56.0" rx="8" class="box"/><text x="34.0" y="460.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" class="t1 halo" text-anchor="start">Check Files</text><text x="34.0" y="478.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" class="t2 halo" text-anchor="start">DESCRIBE DETAIL → numFiles</text><rect x="220.0" y="440.0" width="150.0" height="56.0" rx="8" class="boxd"/><text x="230.0" y="460.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" class="t1 halo" text-anchor="start">If &gt; 20 files</text><rect x="400.0" y="440.0" width="170.0" height="56.0" rx="8" class="boxc"/><text x="410.0" y="460.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" class="t1 halo" text-anchor="start">Optimize Table</text><text x="410.0" y="478.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" class="t2 halo" text-anchor="start">Run 1: 1m 16s + 1m 5s</text><rect x="400.0" y="500.0" width="170.0" height="36.0" rx="8" class="box"/><text x="410.0" y="520.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" class="t1 halo" text-anchor="start">False: skipped (run 2)</text><line x1="194" y1="468" x2="212.0" y2="468.0" class="edge" stroke-width="1.5"/><polygon points="220,468 212.0,472.0 212.0,464.0" class="t3"/><line x1="370" y1="462" x2="392.0" y2="462.0" class="edge" stroke-width="1.5"/><polygon points="400,462 392.0,466.0 392.0,458.0" class="t3"/><line x1="370" y1="480" x2="394.7" y2="508.0" class="edge" stroke-width="1.5"/><polygon points="400,514 391.7,510.6 397.7,505.4" class="t3"/><text x="24.0" y="556.0" font-family="system-ui, -ap