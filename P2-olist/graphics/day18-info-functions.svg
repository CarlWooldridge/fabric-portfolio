<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="682" viewBox="0 0 1040 682"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f2328"/></marker></defs><rect x="1" y="1" width="1038" height="680" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="24" y="40" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#1f2328" text-anchor="start">Information functions — questions you ask the filter context</text><text x="24" y="64" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#57606a" text-anchor="start">Each one asks about one column. Every answer below is for 'dim_seller'[seller_state], checked live against Olist Model.</text><rect x="24" y="86" width="192" height="128" rx="8" fill="#f6f8fa" stroke="#1f2328" stroke-width="1.5"/><text x="36" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="bold" fill="#1f2328" text-anchor="start">ISFILTERED</text><text x="36" y="138" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="start">Is there a filter directly</text><text x="36" y="156" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="start">on this column?</text><text x="36" y="202" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">returns TRUE / FALSE</text><rect x="222" y="86" width="192" height="128" rx="8" fill="#f6f8fa" stroke="#1f2328" stroke-width="1.5"/><text x="234" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="bold" fill="#1f2328" text-anchor="start">ISCROSSFILTERED</text><text x="234" y="138" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="start">Does any filter reach it —</text><text x="234" y="156" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="start">directly, via a sibling</text><text x="234" y="174" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="start">column, or a relationship?</text><text x="234" y="202" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">returns TRUE / FALSE</text><rect x="420" y="86" width="192" height="128" rx="8" fill="#f6f8fa" stroke="#1f2328" stroke-width="1.5"/><text x="432" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="bold" fill="#1f2328" text-anchor="start">ISINSCOPE</text><text x="432" y="138" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="start">Is this column a grouping</text><text x="432" y="156" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="start">level on this row of the</text><text x="432" y="174" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="start">visual?</text><text x="432" y="202" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">returns TRUE / FALSE</text><rect x="618" y="86" width="192" height="128" rx="8" fill="#f6f8fa" stroke="#1f2328" stroke-width="1.5"/><text x="630" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="bold" fill="#1f2328" text-anchor="start">HASONEVALUE</text><text x="630" y="138" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="start">After all filters, is</text><text x="630" y="156" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="start">exactly one value left?</text><text x="630" y="202" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">returns TRUE / FALSE</text><rect x="816" y="86" width="192" height="128" rx="8" fill="#f6f8fa" stroke="#1f2328" stroke-width="1.5"/><text x="828" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="bold" fill="#1f2328" text-anchor="start">SELECTEDVALUE</text><text x="828" y="138" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="start">The one value left — or</text><text x="828" y="156" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="start">the alternate if there are</text><text x="828" y="174" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="start">none or several.</text><text x="828" y="202" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="start">returns a value</text><text x="24" y="242" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="1" font-weight="normal" fill="#1f2328" text-anchor="start"></text><rect x="211.0" y="250" width="155.6" height="70" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1"/><text x="288.8" y="272" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f2328" text-anchor="middle">Matrix Total row</text><text x="288.8" y="292" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="middle">no filters</text><text x="288.8" y="310" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#0b3d91" text-anchor="middle">Setup 1</text><rect x="372.6" y="250" width="155.6" height="70" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1"/><text x="450.40000000000003" y="272" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f2328" text-anchor="middle">Matrix row SP</text><text x="450.40000000000003" y="292" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="middle">rows = seller_state</text><text x="450.40000000000003" y="310" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#0b3d91" text-anchor="middle">Setup 1</text><rect x="534.2" y="250" width="155.6" height="70" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1"/><text x="612.0" y="272" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f2328" text-anchor="middle">Slicer city = Campinas</text><text x="612.0" y="292" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="middle">a sibling column</text><text x="612.0" y="310" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#0b3d91" text-anchor="middle">Setup 2</text><rect x="695.8" y="250" width="155.6" height="70" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1"/><text x="773.5999999999999" y="272" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f2328" text-anchor="middle">Slicer state = SP</text><text x="773.5999999999999" y="292" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="middle">filtered, not grouped</text><text x="773.5999999999999" y="310" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#0b3d91" text-anchor="middle">Setup 2b</text><rect x="857.4" y="250" width="155.6" height="70" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1"/><text x="935.1999999999999" y="272" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f2328" text-anchor="middle">Slicer cust. state = RJ</text><text x="935.1999999999999" y="292" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#57606a" text-anchor="middle">another table</text><text x="935.1999999999999" y="310" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#0b3d91" text-anchor="middle">Setup 3</text><text x="24" y="357" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="start">ISFILTERED</text><rect x="211.0" y="334" width="155.6" height="36" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1"/><text x="288.8" y="357" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#57606a" text-anchor="middle">✗ FALSE</text><rect x="372.6" y="334" width="155.6" height="36" rx="8" fill="#dbe9ff" stroke="#1f2328" stroke-width="2"/><text x="450.40000000000003" y="357" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="middle">✓ TRUE</text><rect x="534.2" y="334" width="155.6" height="36" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1"/><text x="612.0" y="357" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#57606a" text-anchor="middle">✗ FALSE</text><rect x="695.8" y="334" width="155.6" height="36" rx="8" fill="#dbe9ff" stroke="#1f2328" stroke-width="2"/><text x="773.5999999999999" y="357" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="middle">✓ TRUE</text><rect x="857.4" y="334" width="155.6" height="36" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1"/><text x="935.1999999999999" y="357" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#57606a" text-anchor="middle">✗ FALSE</text><text x="24" y="401" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="start">ISCROSSFILTERED</text><rect x="211.0" y="378" width="155.6" height="36" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1"/><text x="288.8" y="401" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#57606a" text-anchor="middle">✗ FALSE</text><rect x="372.6" y="378" width="155.6" height="36" rx="8" fill="#dbe9ff" stroke="#1f2328" stroke-width="2"/><text x="450.40000000000003" y="401" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="middle">✓ TRUE</text><rect x="534.2" y="378" width="155.6" height="36" rx="8" fill="#dbe9ff" stroke="#1f2328" stroke-width="2"/><text x="612.0" y="401" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="middle">✓ TRUE</text><rect x="695.8" y="378" width="155.6" height="36" rx="8" fill="#dbe9ff" stroke="#1f2328" stroke-width="2"/><text x="773.5999999999999" y="401" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="middle">✓ TRUE</text><rect x="857.4" y="378" width="155.6" height="36" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1"/><text x="935.1999999999999" y="401" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#57606a" text-anchor="middle">✗ FALSE</text><text x="24" y="445" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="start">ISINSCOPE</text><rect x="211.0" y="422" width="155.6" height="36" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1"/><text x="288.8" y="445" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#57606a" text-anchor="middle">✗ FALSE</text><rect x="372.6" y="422" width="155.6" height="36" rx="8" fill="#dbe9ff" stroke="#1f2328" stroke-width="2"/><text x="450.40000000000003" y="445" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="middle">✓ TRUE</text><rect x="534.2" y="422" width="155.6" height="36" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1"/><text x="612.0" y="445" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#57606a" text-anchor="middle">✗ FALSE</text><rect x="695.8" y="422" width="155.6" height="36" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1"/><text x="773.5999999999999" y="445" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#57606a" text-anchor="middle">✗ FALSE</text><rect x="857.4" y="422" width="155.6" height="36" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1"/><text x="935.1999999999999" y="445" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#57606a" text-anchor="middle">✗ FALSE</text><text x="24" y="489" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="start">HASONEVALUE</text><rect x="211.0" y="466" width="155.6" height="36" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1"/><text x="288.8" y="489" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#57606a" text-anchor="middle">✗ FALSE</text><rect x="372.6" y="466" width="155.6" height="36" rx="8" fill="#dbe9ff" stroke="#1f2328" stroke-width="2"/><text x="450.40000000000003" y="489" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="middle">✓ TRUE</text><rect x="534.2" y="466" width="155.6" height="36" rx="8" fill="#dbe9ff" stroke="#1f2328" stroke-width="2"/><text x="612.0" y="489" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="middle">✓ TRUE</text><rect x="695.8" y="466" width="155.6" height="36" rx="8" fill="#dbe9ff" stroke="#1f2328" stroke-width="2"/><text x="773.5999999999999" y="489" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="middle">✓ TRUE</text><rect x="857.4" y="466" width="155.6" height="36" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1"/><text x="935.1999999999999" y="489" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#57606a" text-anchor="middle">✗ FALSE</text><text x="24" y="533" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="start">SELECTEDVALUE</text><rect x="211.0" y="510" width="155.6" height="36" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1"/><text x="288.8" y="533" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="normal" fill="#1f2328" text-anchor="middle">All states</text><rect x="372.6" y="510" width="155.6" height="36" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1"/><text x="450.40000000000003" y="533" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="middle">SP</text><rect x="534.2" y="510" width="155.6" height="36" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1"/><text x="612.0" y="533" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="middle">SP</text><rect x="695.8" y="510" width="155.6" height="36" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1"/><text x="773.5999999999999" y="533" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="middle">SP</text><rect x="857.4" y="510" width="155.6" height="36" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1"/><text x="935.1999999999999" y="533" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="normal" fill="#1f2328" text-anchor="middle">All states</text><text x="24" y="580" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328"><tspan font-weight="bold">Row SP vs slicer SP:</tspan> ISFILTERED can't tell a row header from a slicer; ISINSCOPE can. That's why Setup 4 uses ISINSCOPE to blank totals.</text><text x="24" y="602" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328"><tspan font-weight="bold">Campinas:</tspan> filtering a sibling column narrows seller_state — ISCROSSFILTERED sees it, ISFILTERED doesn't.</text><text x="24" y="624" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328"><tspan font-weight="bold">RJ:</tspan> the filter reaches the lines (ISCROSSFILTERED('fact_order_items') = TRUE) but never climbs back to dim_seller.</text><text x="24" y="646" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328"><tspan font-weight="bold">SELECTEDVALUE</tspan> is HASONEVALUE + VALUES in one call: TRUE → the value, FALSE → the alternate.</text></svg>