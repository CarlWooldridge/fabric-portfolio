<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img"><title>Model RLS: put the rule at the top of what you protect</title><desc>Signed in as each test user (Test as role doesn&#x27;t work with SSO on Direct Lake on OneLake). A seller rule filters only the lines. Orders, customers and payments sit uphill and leak. A customer rule secures all four.</desc><style>
