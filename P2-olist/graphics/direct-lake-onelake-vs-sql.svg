<svg xmlns="http://www.w3.org/2000/svg" width="968" height="574" viewBox="0 0 968 574" role="img"><title>Direct Lake on OneLake vs Direct Lake on SQL, built both ways</title><desc>Olist Model (on OneLake) and Olist DL SQL over the same gold tables. The dialog defaults to “on OneLake”; the lakehouse&#x27;s New semantic model button makes that flavor.</desc><style>
