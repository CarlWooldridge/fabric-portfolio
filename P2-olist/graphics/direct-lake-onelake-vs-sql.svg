.s1{fill:#3987e5}.s2{fill:#d95926}.s3{fill:#199e70}.s4{fill:#c98500}.mut{fill:#52514e}
.l1{stroke:#3987e5}.l2{stroke:#d95926}.lmut{stroke:#52514e}
