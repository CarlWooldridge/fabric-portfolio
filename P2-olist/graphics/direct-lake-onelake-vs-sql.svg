.0" x2="944.0" y2="164.0" class="grid" stroke-width="1"/><text x="32.0" y="182.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" class="t1 halo" text-anchor="start">Sources</text><rect x="286.0" y="167.0" width="326.0" height="34.0" rx="4" class="okbg"/><text x="294.0" y="183.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" class="good halo" text-anchor="start">✓</text><text x="312.0" y="182.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" class="t1 halo" text-anchor="start">One or more Fabric items</text><rect x="616.0" y="167.0" width="326.0" height="34.0" rx="4" class="warnbg"/><text x="624.0" y="183.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" class="warn halo" text-anchor="start">!</text><text x="642.0" y="182.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" class="t1 halo" text-anchor="start">One item</text><line x1="24.0" y1="204.0" x2="944.0" y2="204.0" class="grid" stroke-width="1"/><text x="32.0" y="222.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" class="t1 halo" text-anchor="start">SQL views</text><rect x="286.0" y="207.0" width="326.0" height="34.0" rx="4" class="badbg"/><text x="294.0" y="223.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" class="bad halo" text-anchor="start">✕</text><text x="312.0" y="222.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" class="t1 halo" text-anchor="start">Can&#x27;t add them</text><rect x="616.0" y="207.0" width="326.0" height="34.0" rx="4" class="warnbg"/><text x="624.0" y="223.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" class="warn halo" text-anchor="start">!</text><text x="642.0" y="222.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" class="t1 halo" text-anchor="start">Allowed, but always DirectQuery</text><line x1="24.0" y1="244.0" x2="944.0" y2="244.0" class="grid" stroke-width="1"/><text x="32.0" y="262.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" class="t1 halo" text-anchor="start">When it can&#x27;t read Delta</text><rect x="286.0" y="247.0" width="326.0" height="34.0" rx="4" class="okbg"/><text x="294.0" y="263.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" class="good halo" text-anchor="start">✓</text><text x="312.0" y="262.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" class="t1 halo" text-anchor="start">Errors (no fallback)</text><rect x="616.0" y="247.0" width="326.0" height="34.0" rx="4" class="warnbg"/><text x="624.0" y="263.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" class="warn halo" text-anchor="start">!</text><text x="642.0" y="262.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" class="t1 halo" text-anchor="start">Falls back to DirectQuery, silently</text><line x1="24.0" y1="284.0" x2="944.0" y2="284.0" class="grid" stroke-width="1"/><text x="32.0" y="302.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" class="t1 halo" text-anchor="start">SQL-endpoint RLS / CLS</text><rect x="286.0" y="287.0" width="326.0" height="34.0" rx="4" class="warnbg"/><text x="294.0" y="303.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" class="warn halo" text-anchor="start">!</text><text x="312.0" y="302.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" class="t1 halo" text-anchor="start">Ignored: reads the files</text><rect x="616.0" y="287.0" width="326.0" height="34.0" rx="4" class="okbg"/><text x="624.0" y="303.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" class="good halo" text-anchor="start">✓</text><text x="642.0" y="302.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" class="t1 halo" text-anchor="start">Applied, via fallback</text><line x1="24.0" y1="324.0" x2="944.0" y2="324.0" class="grid" stroke-width="1"/><text x="32.0" y="342.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" class="t1 halo" text-anchor="start">Composite with Import tables</text><rect x="286.0" y="327.0" width="326.0" height="34.0" rx="4" class="okbg"/><text x="294.0" y="343.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" class="good halo" text-anchor="start">✓</text><text x="312.0" y="342.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" class="t1 halo" text-anchor="start">Yes</text><rect x="616.0" y="327.0" width="326.0" height="34.0" rx="4" class="badbg"/><text x="624.0" y="343.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" class="bad halo" text-anchor="start">✕</text><text x="642.0" y="342.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" class="t1 halo" text-anchor="start">No</text><line x1="24.0" y1="364.0" x2="944.0" y2="364.0" class="grid" stroke-width="1"/><text x="32.0" y="382.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" class="t1 halo" text-anchor="start">Calculated columns</text><rect x="286.0" y="367.0" width="326.0" height="34.0" rx="4" class="okbg"/><text x="294.0" y="383.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" class="good halo" text-anchor="start">✓</text><text x="312.0" y="382.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" class="t1 halo" text-anchor="start">Preview: user-context, not stored</text><rect x="616.0" y="367.0" width="326.0" height="34.0" rx="4" class="badbg"/><text x="624.0" y="383.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" class="bad halo" text-anchor="start">✕</text><text x="642.0" y="382.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" class="t1 halo" text-anchor="start">Grayed out</text><line x1="24.0" y1="404.0" x2="944.0" y2="404.0" class="grid" stroke-width="1"/><text x="32.0" y="422.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" class="t1 halo" text-anchor="start">Deployment rebind</text><rect x="286.0" y="407.0" width="326.0" height="34.0" rx="4" class="warnbg"/><text x="294.0" y="423.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" class="warn halo" text-anchor="start">!</text><text x="312.0" y="422.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" class="t1 halo" text-anchor="s