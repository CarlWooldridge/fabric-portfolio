 only after the SQL endpoint syncs, and</text><text x="24.0" y="524.2" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" class="t2 halo" text-anchor="start">after any Git update a Direct Lake model answers nothing until Refresh now reframes it.</text><text x="24.0" y="560.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" class="t3 halo" text-anchor="start">Source: DP600_BUILD_GUIDE.md Days 15, 19, 24, 25; Microsoft&#x27;s Direct Lake overview (2026-09-18)</text></svg>