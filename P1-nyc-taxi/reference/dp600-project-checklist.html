<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DP-600 Project Checklist</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root {
    --bg: #14181C;
    --panel: #1B2027;
    --panel-2: #20262E;
    --border: #2C333C;
    --text: #E8EAED;
    --text-dim: #8B93A1;
    --text-faint: #5B6470;
    --accent: #2DD4BF;
    --accent-dim: #1B4A45;
    --warn: #F5A623;
    --font-sans: 'IBM Plex Sans', -apple-system, sans-serif;
    --font-mono: 'IBM Plex Mono', 'SF Mono', monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
    padding: 20px 14px 60px;
  }

  .wrap { max-width: 720px; margin: 0 auto; }

  header {
    margin-bottom: 24px;
  }

  .eyebrow {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 6px;
  }

  h1 {
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }

  .subhead {
    font-size: 13px;
    color: var(--text-dim);
    line-height: 1.5;
  }

  .overall {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 18px;
    padding: 14px 16px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
  }

  .overall-num {
    font-family: var(--font-mono);
    font-size: 22px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: var(--accent);
    white-space: nowrap;
  }

  .overall-bar-track {
    flex: 1;
    height: 6px;
    background: var(--panel-2);
    border-radius: 3px;
    overflow: hidden;
  }

  .overall-bar-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 3px;
    transition: width 0.3s ease;
  }

  .project {
    margin-bottom: 20px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }

  .project-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    cursor: pointer;
    user-select: none;
    gap: 12px;
  }

  .project-head:active { background: var(--panel-2); }

  .project-title-block { min-width: 0; }

  .project-label {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin-bottom: 2px;
  }

  .project-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
  }

  .project-goal {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 2px;
    line-height: 1.4;
  }

  .project-stats {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }

  .ring {
    position: relative;
    width: 40px;
    height: 40px;
    flex-shrink: 0;
  }

  .ring svg { transform: rotate(-90deg); }

  .ring-track { fill: none; stroke: var(--panel-2); stroke-width: 4; }
  .ring-fill { fill: none; stroke: var(--accent); stroke-width: 4; stroke-linecap: round; transition: stroke-dashoffset 0.3s ease; }

  .ring-num {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 600;
    color: var(--text-dim);
  }

  .chevron {
    color: var(--text-faint);
    transition: transform 0.2s ease;
    flex-shrink: 0;
  }

  .project.collapsed .chevron { transform: rotate(-90deg); }

  .project-body {
    border-top: 1px solid var(--border);
  }

  .project.collapsed .project-body { display: none; }

  .section-note {
    font-size: 11px;
    color: var(--warn);
    padding: 10px 16px 0;
    line-height: 1.5;
  }

  ul.items {
    list-style: none;
    margin: 0;
    padding: 8px 0 12px;
  }

  .item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 8px 16px;
  }

  .item:active { background: var(--panel-2); }

  .checkbox {
    width: 19px;
    height: 19px;
    flex-shrink: 0;
    margin-top: 1px;
    border: 1.5px solid var(--text-faint);
    border-radius: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .checkbox.checked {
    background: var(--accent);
    border-color: var(--accent);
  }

  .checkbox svg { width: 12px; height: 12px; display: none; }
  .checkbox.checked svg { display: block; }

  .item-text {
    font-size: 13.5px;
    line-height: 1.45;
    cursor: pointer;
    color: var(--text);
  }

  .item.done .item-text {
    color: var(--text-faint);
    text-decoration: line-through;
    text-decoration-color: var(--border);
  }

  .reset-row {
    text-align: center;
    margin-top: 24px;
  }

  .reset-btn {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-faint);
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 14px;
    cursor: pointer;
    letter-spacing: 0.04em;
  }

  .reset-btn:active { background: var(--panel); }

  .loading {
    text-align: center;
    color: var(--text-faint);
    font-family: var(--font-mono);
    font-size: 12px;
    padding: 40px 0;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Fabric &middot; DP-600</div>
    <h1>Project Checklist</h1>
    <div class="subhead">NYC Taxi/WWI &rarr; Kaggle finance/supply-chain &rarr; Carl's own build. Checked state saves automatically.</div>
    <div class="overall">
      <div class="overall-num" id="overallNum">0%</div>
      <div class="overall-bar-track"><div class="overall-bar-fill" id="overallBar" style="width:0%"></div></div>
    </div>
  </header>

  <div id="projects"><div class="loading">Loading checklist…</div></div>

  <div class="reset-row">
    <button class="reset-btn" id="resetBtn">RESET ALL PROGRESS</button>
  </div>
</div>

<script>
const DATA = [
  {
    id: "p1",
    label: "Project 1",
    title: "NYC Taxi or Wide World Importers",
    goal: "Touch every mechanism once, on clean data. Speed over polish.",
    note: null,
    items: [
      "Workspace on trial capacity; Lakehouse created",
      "Ingest same dataset 3 ways: Dataflow Gen2, Data pipeline (Copy activity), notebook — compare them",
      "Load to Delta tables; inspect Files vs. Tables split in OneLake",
      "Query via SQL analytics endpoint (T-SQL) and visual query editor",
      "Build minimal star schema (1 fact, 3–4 dims)",
      "Create Direct Lake semantic model; confirm it's actually Direct Lake, not fallback",
      "5–8 DAX measures with a proper date table and time intelligence",
      "One Power BI report on top",
      "Create a Warehouse alongside the Lakehouse loading same data — note when you'd pick each"
    ]
  },
  {
    id: "p2",
    label: "Project 2",
    title: "Kaggle finance or supply-chain dataset",
    goal: "Messy real data + semantic model depth + first governance layer.",
    note: "Assumes everything from Project 1 is already solid.",
    items: [
      "Data profiling before transforming — document what's actually wrong with the data",
      "Bronze/silver/gold medallion layering",
      "Incremental load pattern — not full refresh",
      "At least one slowly changing dimension (Type 2)",
      "Notebook-based Python transformation where Dataflow Gen2 can't cleanly do it",
      "Calculation groups (replacing duplicated measure variants)",
      "Field parameters and dynamic format strings",
      "Row-level security, tested with a viewer account",
      "Object-level security on at least one sensitive measure/column",
      "Sensitivity labels + item endorsement",
      "A deliberately bad model, then optimized — record before/after refresh and query times"
    ]
  },
  {
    id: "p3",
    label: "Project 3",
    title: "Carl's own build",
    goal: "Architecture ownership + lifecycle. Portfolio centerpiece.",
    note: "Consider: legacy SQL Server → Fabric migration simulation.",
    items: [
      "Original source data assembled yourself (API pull, scraped, or spec'd)",
      "Written architecture decision doc — Lakehouse vs. Warehouse vs. Eventhouse, and why",
      "Git integration on the workspace; .pbip project format",
      "Deployment pipeline: Dev → Test → Prod workspaces",
      "Impact analysis run before a breaking rename/delete — screenshot it",
      "Semantic model deployed/managed via XMLA endpoint (Tabular Editor or TMSL)",
      "Reusable assets: a .pbit template + shared semantic model consumed by a 2nd report",
      "File-level OneLake security",
      "Large semantic model storage format enabled where justified",
      "Eventhouse + KQL component (e.g. USGS or MTA feed)",
      "Full README: architecture diagram, decisions, tradeoffs, what you'd change"
    ]
  }
];

const STORAGE_KEY = "dp600-checklist-state";
let state = {
  checked: {
    "p1-0": true, "p1-1": true, "p1-2": true, "p1-3": true, "p1-4": true,
    "p1-5": true, "p1-6": true, "p1-7": true, "p1-8": true
  },
  collapsed: {}
};

function itemId(projectId, idx) { return projectId + "-" + idx; }

async function loadState() {
  try {
    const result = await window.storage.get(STORAGE_KEY, false);
    if (result && result.value) {
      state = JSON.parse(result.value);
      if (!state.checked) state.checked = {};
      if (!state.collapsed) state.collapsed = {};
    }
  } catch (e) {
    console.log("No saved state yet, starting fresh.");
  }
}

async function saveState() {
  try {
    await window.storage.set(STORAGE_KEY, JSON.stringify(state), false);
  } catch (e) {
    console.error("Failed to save checklist state:", e);
  }
}

function circumference(r) { return 2 * Math.PI * r; }

function render() {
  const container = document.getElementById("projects");
  container.innerHTML = "";

  let totalItems = 0, totalChecked = 0;

  DATA.forEach(project => {
    const total = project.items.length;
    const checkedCount = project.items.filter((_, i) => state.checked[itemId(project.id, i)]).length;
    totalItems += total;
    totalChecked += checkedCount;
    const pct = total ? Math.round((checkedCount / total) * 100) : 0;
    const r = 16;
    const c = circumference(r);
    const offset = c - (pct / 100) * c;
    const isCollapsed = !!state.collapsed[project.id];

    const projectEl = document.createElement("div");
    projectEl.className = "project" + (isCollapsed ? " collapsed" : "");

    const head = document.createElement("div");
    head.className = "project-head";
    head.innerHTML = `
      <div class="project-title-block">
        <div class="project-label">${project.label}</div>
        <div class="project-title">${project.title}</div>
        <div class="project-goal">${project.goal}</div>
      </div>
      <div class="project-stats">
        <div class="ring">
          <svg width="40" height="40" viewBox="0 0 40 40">
            <circle class="ring-track" cx="20" cy="20" r="${r}"></circle>
            <circle class="ring-fill" cx="20" cy="20" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${offset}"></circle>
          </svg>
          <div class="ring-num">${pct}%</div>
        </div>
        <svg class="chevron" width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    `;
    head.addEventListener("click", () => {
      state.collapsed[project.id] = !state.collapsed[project.id];
      saveState();
      render();
    });

    const body = document.createElement("div");
    body.className = "project-body";

    if (project.note) {
      const note = document.createElement("div");
      note.className = "section-note";
      note.textContent = project.note;
      body.appendChild(note);
    }

    const ul = document.createElement("ul");
    ul.className = "items";

    project.items.forEach((text, idx) => {
      const id = itemId(project.id, idx);
      const checked = !!state.checked[id];
      const li = document.createElement("li");
      li.className = "item" + (checked ? " done" : "");
      li.innerHTML = `
        <div class="checkbox ${checked ? "checked" : ""}" data-id="${id}">
          <svg viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-6" stroke="#14181C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="item-text" data-id="${id}">${text}</div>
      `;
      const toggle = async () => {
        state.checked[id] = !state.checked[id];
        await saveState();
        render();
      };
      li.querySelector(".checkbox").addEventListener("click", toggle);
      li.querySelector(".item-text").addEventListener("click", toggle);
      ul.appendChild(li);
    });

    body.appendChild(ul);
    projectEl.appendChild(head);
    projectEl.appendChild(body);
    container.appendChild(projectEl);
  });

  const overallPct = totalItems ? Math.round((totalChecked / totalItems) * 100) : 0;
  document.getElementById("overallNum").textContent = overallPct + "%";
  document.getElementById("overallBar").style.width = overallPct + "%";
}

document.getElementById("resetBtn").addEventListener("click", async () => {
  if (confirm("Reset all checklist progress? This can't be undone.")) {
    state = { checked: {}, collapsed: state.collapsed };
    await saveState();
    render();
  }
});

(async () => {
  await loadState();
  render();
})();
</script>
</body>
</html>
